<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقرير إيكو</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="إيكو">
<meta name="theme-color" content="#1f6f6b">
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#667085; --line:#d9dee5; --accent:#1f6f6b; --accent-ink:#fff; --warn:#fff3a3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232b; --ink:#e8ecf1; --muted:#9aa5b4; --line:#34404d; --accent:#4fb3ad; --accent-ink:#0b1514; --warn:#6b5d12; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, "Segoe UI", Tahoma, Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  fieldset { background:var(--card); border:1px solid var(--line); border-radius:12px; margin:0 0 14px; padding:12px 14px 6px; }
  legend { padding:0 6px; font-weight:600; font-size:14px; color:var(--muted); }
  label { display:block; margin:0 0 12px; font-size:14px; }
  label span { display:block; margin-bottom:4px; }
  label small { color:var(--muted); }
  input, select { width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); direction:ltr; text-align:left; }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .req::after { content:" *"; color:#c0392b; }
  .num { display:none; }
  .num.on { display:block; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { font:inherit; font-size:17px; font-weight:600; width:100%; padding:14px; border:0; border-radius:10px; background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); margin-top:10px; font-weight:500; }
  #msg { margin:12px 0; min-height:1.4em; font-size:14px; color:var(--muted); }
  #preview { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:8px; direction:ltr; text-align:left; font-size:14px; display:none; }
  #preview h2 { font-size:13px; margin:10px 0 4px; color:var(--muted); font-style:italic; }
  #preview h2:first-child { margin-top:0; }
  #preview p { margin:2px 0; }
  #preview mark { background:var(--warn); color:inherit; padding:0 3px; border-radius:3px; }
  #log { margin-top:18px; }
  #log h2 { font-size:15px; margin:0 0 8px; }
  .case { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; font-size:14px; }
  .case .nm { flex:1; direction:ltr; text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .case .st { font-size:12px; color:var(--muted); white-space:nowrap; }
  .case button { width:auto; font-size:13px; padding:6px 10px; font-weight:500; }
  .offline { font-size:12px; color:var(--muted); text-align:center; margin-top:18px; }
</style>
</head>
<body>
<main>
  <h1>تقرير إيكو</h1>
  <p class="sub">املأ البيانات واضغط الزرار. بيطلع ملفين Word: ملف الحالة والتقرير. الصفحة دي شغالة من غير إنترنت.</p>

  <form id="f" autocomplete="off">
    <fieldset>
      <legend>بيانات الحالة</legend>
      <label><span class="req">Patient name</span><input name="Patient name" required></label>
      <div class="row">
        <label><span class="req">Age</span><input name="Age" placeholder="5 yrs & 6 m" required></label>
        <label><span>Weight</span><input name="Weight" placeholder="19 kg"></label>
      </div>
      <label><span>Nursery name <small>(سيبها فاضية لو العيادة)</small></span><input name="Nursery name"></label>
      <div class="row">
        <label><span>Origin <small>(البلد)</small></span><input name="Origin"></label>
        <label><span>Complaint</span><input name="Complaint" placeholder="?? murmur"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>نتيجة الإيكو <small>(الباقي Normal تلقائي)</small></legend>
      <label><span>Atrial septum</span>
        <select name="Atrial septum" data-num="PFO size (mm)"><option>Normal</option><option>PFO</option><option>ASD II</option><option>ASD primum</option></select></label>
      <label class="num" data-for="PFO size (mm)"><span>Defect size (mm)</span><input name="PFO size (mm)" inputmode="decimal"></label>

      <label><span>Ventricular septum</span>
        <select name="Ventricular septum" data-num="VSD size (mm)"><option>Normal</option><option>VSD</option><option>PMVSD</option><option>Apical VSD</option><option>MVSD</option></select></label>
      <label class="num" data-for="VSD size (mm)"><span>Defect size (mm)</span><input name="VSD size (mm)" inputmode="decimal"></label>

      <label><span>Tricuspid valve</span>
        <select name="Tricuspid valve" data-num="RVSP (mmHg)"><option>Normal</option><option>Mild TR</option><option>Moderate TR</option><option>Severe TR</option></select></label>
      <label class="num" data-for="RVSP (mmHg)"><span>RVSP (mmHg)</span><input name="RVSP (mmHg)" inputmode="decimal"></label>

      <label><span>Mitral valve</span>
        <select name="Mitral valve"><option>Normal</option><option>Mild MR</option><option>Moderate MR</option><option>Severe MR</option></select></label>

      <label><span>Pulmonary hypertension</span>
        <select name="Pulmonary hypertension"><option>None</option><option>Mild</option><option>Moderate</option><option>Severe</option></select></label>

      <label><span>Pulmonary valve</span>
        <select name="Pulmonary valve" data-num="PS PG (mmHg)"><option>Normal</option><option>Mild PS</option><option>Moderate PS</option><option>Severe PS</option></select></label>
      <label class="num" data-for="PS PG (mmHg)"><span>PS PG (mmHg)</span><input name="PS PG (mmHg)" inputmode="decimal"></label>

      <label><span>Aortic valve</span>
        <select name="Aortic valve" data-num="AS PG (mmHg)|AS mean PG (mmHg)"><option>Normal</option><option>Mild AS</option><option>Moderate AS</option><option>Severe AS</option></select></label>
      <div class="row">
        <label class="num" data-for="AS PG (mmHg)"><span>AS PG (mmHg)</span><input name="AS PG (mmHg)" inputmode="decimal"></label>
        <label class="num" data-for="AS mean PG (mmHg)"><span>AS mean PG (mmHg)</span><input name="AS mean PG (mmHg)" inputmode="decimal"></label>
      </div>

      <label><span>Ductus</span>
        <select name="Ductus" data-num="PDA size (mm)"><option>Normal</option><option>Small PDA</option><option>Moderate PDA</option><option>Large PDA</option></select></label>
      <label class="num" data-for="PDA size (mm)"><span>PDA size (mm)</span><input name="PDA size (mm)" inputmode="decimal"></label>
    </fieldset>

    <button type="submit">اعمل التقرير</button>
    <button type="button" class="secondary" id="newCase">حالة جديدة</button>
  </form>

  <div id="dirBox" style="display:none;margin:12px 0">
    <button type="button" class="secondary" id="pickDir" style="margin-top:0">اختار فولدر العيادة</button>
    <div id="dirMsg" style="margin-top:6px;font-size:13px;color:var(--muted)"></div>
  </div>
  <div id="msg" role="status"></div>
  <div id="preview"></div>
  <div id="log">
    <h2>الحالات المحفوظة <span id="count"></span></h2>
    <div id="list"></div>
    <button type="button" id="syncBtn">ابعت للسيرفر</button>
    <button type="button" class="secondary" id="backupBtn">نسخة احتياطية (ملف)</button>
    <label style="margin-top:14px"><span>كود الدخول <small>(بتكتبه مرة واحدة على كل جهاز)</small></span><input id="codeIn" type="password" autocomplete="off"></label>
    <button type="button" class="secondary" id="codeSave">حفظ الكود</button>
    <div id="syncMsg" role="status" style="margin-top:8px;font-size:14px;color:var(--muted)"></div>
  </div>
  <p class="offline">كل حالة بتتحفظ على الجهاز باسمها، وبتتبعت للسيرفر لما يبقى فيه إنترنت.</p>
</main>

<script>
/* ===== findings library + Word XML builders (generated from the n8n Code node, single source of truth) ===== */
function buildDocs(FORM) {
// n8n Code node ("Run Once for All Items"). No external modules: it writes the raw WordprocessingML
// parts of two .docx files; the next node (Compression) zips each item's parts into a real .docx.

// ---------- findings library (wording copied from the doctor's template/notes) ----------
// normal: null => his normal sentence not seen yet -> yellow placeholder, never invented
const STRUCTURES = [
  { id: 'situs', normal: 'Situs solitus, levocardia, AV-VA concordance.' },
  { id: 'venous', normal: 'Normal systemic & pulmonary venous drainage.' },
  { id: 'atrial_septum', normal: 'Normal intra Atrail septum.', options: {
    PFO: { echo: 'Patent Foramen Oval[, {size_mm} mm], with {shunt} shunt.', conclusion: 'PFO[, {size_mm} mm], {shunt} shunt.' },
    'ASD II': { echo: null, conclusion: null },
    'ASD primum': { echo: null, conclusion: null } } },
  { id: 'ventricular_septum', normal: 'Intact intra Ventricular septum.', options: {
    VSD: { echo: null, conclusion: null },
    PMVSD: { echo: null, conclusion: null },
    'Apical VSD': { echo: null, conclusion: null },
    MVSD: { echo: null, conclusion: null } } },
  { id: 'tricuspid', normal: 'Normal morphology and movement of Tricuspid valve.', options: {
    TR: { echo: '{severity} Tricuspid valve regurgue[, RVSP = {rvsp} mmHg].', conclusion: '{severity} TR[, RVSP = {rvsp} mmHg].',
          concludeWhen: (f) => f.severity !== 'Mild' } } },
  { id: 'phtn', normal: '', options: { PHTN: { echo: '', conclusion: '{severity} PHTN.' } } },
  { id: 'mitral', normal: 'Normal movement & morphology of Mitral valve.', options: {
    MR: { echo: null, conclusion: null } } },
  { id: 'pulmonary_valve', pair: 'first', options: {
    PS: { echo: null, conclusion: null } } },
  { id: 'semilunar_valves', pair: 'second', options: {
    AS: { echo: null, conclusion: '{severity} AS[, PG = {pg} mmHg][, mean PG = {mean_pg} mmHg].' } } },
  { id: 'ductus', normal: 'No PDA.', options: {
    PDA: { echo: '{severity} Patent Ductus Arteriosus[, {size_mm} mm], {shunt} shunt.', conclusion: '{severity} PDA[, {size_mm} mm], {shunt} shunt.' } } },
  { id: 'arch', normal: 'Normal Lt. Aortic arch, no COA.' },
  { id: 'thrombus', normal: 'No thrombus or mass.' },
  { id: 'function', normal: 'Normal Cardiac function.' },
  { id: 'pe', normal: 'No PE.' },
];
const CONCLUSION_ORDER = ['atrial_septum', 'ventricular_septum', 'tricuspid', 'phtn', 'mitral', 'pulmonary_valve', 'semilunar_valves', 'ductus'];
// his single sentence for normal pulmonary + aortic valves; used only when both are normal
const PAIR_NORMAL = 'Normal Pulmonary & Aortic valves, no RVOTO, no LVOTO.';
const NORMAL_CONCLUSION = 'Normal intra Cardiac structure and function.';
const SHUNT = { report: 'Lt-Rt', note: 'L-R' };

// ---------- read the form ----------
const f = FORM;
const get = (k) => (f[k] === undefined || f[k] === null ? '' : String(f[k]).trim());
const sev = (v) => v.replace(/\s*(TR|AS|PDA|MR|PS)$/i, '').trim();
const findings = {};
const SEPTAL = (v, opts) => (opts.includes(v) ? v : '');
const asd = SEPTAL(get('Atrial septum'), ['PFO', 'ASD II', 'ASD primum']);
if (asd) findings.atrial_septum = { option: asd, size_mm: get('PFO size (mm)') };
const vsd = SEPTAL(get('Ventricular septum'), ['VSD', 'PMVSD', 'Apical VSD', 'MVSD']);
if (vsd) findings.ventricular_septum = { option: vsd, size_mm: get('VSD size (mm)') };
if (/TR$/i.test(get('Tricuspid valve'))) findings.tricuspid = { option: 'TR', severity: sev(get('Tricuspid valve')), rvsp: get('RVSP (mmHg)') };
if (/MR$/i.test(get('Mitral valve'))) findings.mitral = { option: 'MR', severity: sev(get('Mitral valve')) };
if (/PS$/i.test(get('Pulmonary valve'))) findings.pulmonary_valve = { option: 'PS', severity: sev(get('Pulmonary valve')), pg: get('PS PG (mmHg)') };
if (['Mild', 'Moderate', 'Severe'].includes(get('Pulmonary hypertension'))) findings.phtn = { option: 'PHTN', severity: get('Pulmonary hypertension') };
if (/AS$/i.test(get('Aortic valve'))) findings.semilunar_valves = { option: 'AS', severity: sev(get('Aortic valve')), pg: get('AS PG (mmHg)'), mean_pg: get('AS mean PG (mmHg)') };
if (/PDA$/i.test(get('Ductus'))) findings.ductus = { option: 'PDA', severity: sev(get('Ductus')), size_mm: get('PDA size (mm)') };

const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Cairo' });
const c = {
  date: today,
  patient: { name: get('Patient name'), age: get('Age'), weight: get('Weight') },
  nursery: get('Nursery name'),
  origin: get('Origin'),
  complaint: get('Complaint'),
  findings,
};

// ---------- compose text ----------
// [ ... ] marks an optional part: it is dropped when a value inside it was left empty in the form
function fill(t, vars, shunt) {
  const val = (k) => (k === 'shunt' ? shunt : vars[k] ? String(vars[k]) : '');
  const sub = (str) => str.replace(/\{(\w+)\}/g, (_, k) => val(k));
  return t
    .replace(/\[([^\]]*)\]/g, (_, inner) => {
      const keys = [...inner.matchAll(/\{(\w+)\}/g)].map((m) => m[1]);
      return keys.every((k) => val(k) !== '') ? sub(inner) : '';
    })
    .replace(/\{(\w+)\}/g, (_, k) => val(k));
}
const plain = (fd) => (fd.severity ? fd.severity + ' ' : '') + fd.option + (fd.size_mm ? ', ' + fd.size_mm + ' mm' : '') + '.';
function compose(style) {
  const shunt = SHUNT[style];
  const echo = [], conclusion = [];
  const bothNormal = !findings.pulmonary_valve && !findings.semilunar_valves;
  for (const s of STRUCTURES) {
    const fd = findings[s.id];
    if (fd) {
      const opt = s.options[fd.option];
      if (opt.echo === null) echo.push({ text: plain(fd) });
      else if (opt.echo !== '') echo.push({ text: fill(opt.echo, fd, shunt) });
    } else if (s.pair) {
      if (bothNormal) { if (s.pair === 'first') echo.push({ text: PAIR_NORMAL }); }
      else { /* one valve abnormal: its own line covers it */ }
    } else if (s.normal === null) { /* no wording yet: leave the line out */ }
    else if (s.normal !== '') echo.push({ text: s.normal });
  }
  for (const id of CONCLUSION_ORDER) {
    const fd = findings[id];
    if (!fd) continue;
    const opt = STRUCTURES.find((s) => s.id === id).options[fd.option];
    if (opt.concludeWhen && !opt.concludeWhen(fd)) continue;
    if (opt.conclusion === null) { conclusion.push({ text: plain(fd) }); continue; }
    conclusion.push({ text: fill(opt.conclusion, fd, shunt) });
  }
  if (!conclusion.length) conclusion.push({ text: NORMAL_CONCLUSION });

  return { echo, conclusion };
}

// ---------- raw WordprocessingML ----------
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const isArabic = (s) => /[؀-ۿ]/.test(s);
// element order inside w:rPr follows the schema: rFonts, b, i, sz, szCs, highlight, u, rtl
const run = (text, o) => {
  const opt = o || {};
  const sz = opt.size || 22;
  return '<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' +
    (opt.bold ? '<w:b/><w:bCs/>' : '') + (opt.italic ? '<w:i/><w:iCs/>' : '') +
    '<w:sz w:val="' + sz + '"/><w:szCs w:val="' + sz + '"/>' +
    (opt.highlight ? '<w:highlight w:val="yellow"/>' : '') + (opt.underline ? '<w:u w:val="single"/>' : '') +
    (isArabic(text) ? '<w:rtl/>' : '') +
    '</w:rPr><w:t xml:space="preserve">' + esc(text) + '</w:t></w:r>';
};
// pPr order: bidi, spacing, jc
const para = (runs, o) => {
  const opt = o || {};
  return '<w:p><w:pPr>' + (opt.bidi ? '<w:bidi/>' : '') +
    '<w:spacing w:before="' + (opt.before || 0) + '" w:after="' + (opt.after || 0) + '"/>' +
    (opt.jc ? '<w:jc w:val="' + opt.jc + '"/>' : '') + '</w:pPr>' + runs + '</w:p>';
};
const lineRun = (l, size) => run('-' + l.text, { size, highlight: l.missing });
const NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
const docXml = (body) => '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ' + NS + '><w:body>' + body +
  '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1440" w:bottom="1134" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
const CONTENT_TYPES = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
const RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';

function noteBody() {
  const { conclusion } = compose('note');
  const place = c.nursery ? c.nursery.replace(/^حضانة\s*/, '') : c.origin;
  const ageLine = c.complaint ? c.patient.age + ', ' + c.complaint : c.patient.age;
  let out = para(run(c.patient.name), { jc: 'left', after: 160 });
  if (place) out += para(run(place), { jc: 'left', after: 160 });
  out += para(run(ageLine), { jc: 'left', after: 160 });
  out += para(run('ECHO:'), { jc: 'left', after: 160 });
  for (const l of conclusion) out += para(lineRun(l, 22), { jc: 'left', after: 160 });
  return out;
}

function reportBody() {
  const { echo, conclusion } = compose('report');
  const widths = [1100, 4300, 1100, 2526];
  const cell = (text, w, bold) => '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' +
    para(text ? run(text, { size: 22, bold }) : '') + '</w:tc>';
  const row = (a, b, d, e) => '<w:tr>' + cell(a, widths[0], true) + cell(b, widths[1], false) + cell(d, widths[2], true) + cell(e, widths[3], false) + '</w:tr>';
  const line = '<w:{n} w:val="single" w:sz="6" w:space="0" w:color="000000"/>';
  const borders = ['top', 'left', 'bottom', 'right', 'insideH', 'insideV'].map((n) => line.replace('{n}', n)).join('');
  const table = '<w:tbl><w:tblPr><w:tblW w:w="9026" w:type="dxa"/><w:tblBorders>' + borders + '</w:tblBorders><w:tblLayout w:type="fixed"/>' +
    '<w:tblCellMar><w:top w:w="70" w:type="dxa"/><w:left w:w="110" w:type="dxa"/><w:bottom w:w="70" w:type="dxa"/><w:right w:w="110" w:type="dxa"/></w:tblCellMar></w:tblPr>' +
    '<w:tblGrid>' + widths.map((w) => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>' +
    row('Name', c.patient.name, 'Date', c.date.split('-').reverse().join('/')) +
    row('Age', c.patient.age, 'Weight', c.patient.weight) + '</w:tbl>';
  const heading = (t) => para(run(t, { size: 24, bold: true, italic: true, underline: true }), { before: 280, after: 160 });
  let out = table + heading('*ECHO:');
  for (const l of echo) out += para(lineRun(l, 20), { after: 120 });
  out += heading('*Conclusion:');
  for (const l of conclusion) out += para(lineRun(l, 20), { after: 120 });
  return out;
}

// ---------- output: two items; each carries the 3 parts of one .docx ----------
const safe = (s) => s.replace(/[\\/:*?"<>|]/g, '').trim();
const base = c.nursery ? safe(c.patient.name) + '(' + safe(c.nursery) + ')' : safe(c.patient.name);
const needs = [...compose('report').echo, ...compose('report').conclusion].filter((l) => l.missing).length;
const warn = needs ? ' (فيه جمل ناقصة معلّمة بالأصفر)' : '';
  return {
    base, needs, CONTENT_TYPES, RELS,
    files: [
      { name: base + '.docx', xml: docXml(noteBody()) },
      { name: base + ' - report.docx', xml: docXml(reportBody()) },
    ],
    preview: compose('report'),
  };
}


/* ===== minimal ZIP writer (no compression) so a .docx can be made with no libraries and no internet ===== */
const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
function makeZip(entries) {
  const enc = new TextEncoder(), chunks = [], central = [];
  const now = new Date();
  const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  let offset = 0;
  for (const e of entries) {
    const name = enc.encode(e.name), data = enc.encode(e.text), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
    chunks.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: DOCX_MIME });
}
function download(blob, fileName) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const form = document.getElementById('f'), msg = document.getElementById('msg'), preview = document.getElementById('preview');

function syncNumbers() {
  document.querySelectorAll('select[data-num]').forEach((sel) => {
    const on = sel.value !== 'Normal' && sel.value !== 'None';
    sel.dataset.num.split('|').forEach((name) => {
      const box = document.querySelector('.num[data-for="' + name + '"]');
      box.classList.toggle('on', on);
      if (!on) box.querySelector('input').value = '';
    });
  });
}
form.addEventListener('change', syncNumbers);

function showPreview(res) {
  preview.textContent = '';
  const add = (tag, text, mark) => {
    const el = document.createElement(tag);
    if (mark) { const m = document.createElement('mark'); m.textContent = text; el.appendChild(m); } else el.textContent = text;
    preview.appendChild(el);
  };
  add('h2', '*ECHO:');
  res.preview.echo.forEach((l) => add('p', '-' + l.text, l.missing));
  add('h2', '*Conclusion:');
  res.preview.conclusion.forEach((l) => add('p', '-' + l.text, l.missing));
  preview.style.display = 'block';
}

/* ===== local case log + sync to n8n ===== */
const SYNC_URL = 'https://deeppink-trout-749734.hostingersite.com/webhook/echo-sync';
const CODE_KEY = 'echo_access_code';
function getCode() { try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; } }
function setCode(v) { try { if (v) localStorage.setItem(CODE_KEY, v); else localStorage.removeItem(CODE_KEY); } catch (e) {} }
const LS_KEY = 'echo_cases_v1';
const listEl = document.getElementById('list'), syncMsg = document.getElementById('syncMsg');

function loadCases() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch (e) { return []; } }
function saveCases(arr) { try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); return true; } catch (e) { return false; } }
function newId() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

function downloadDocs(res) {
  const part = (xml) => makeZip([
    { name: '[Content_Types].xml', text: res.CONTENT_TYPES }, { name: '_rels/.rels', text: res.RELS }, { name: 'word/document.xml', text: xml },
  ]);
  download(part(res.files[0].xml), res.files[0].name);
  setTimeout(() => download(part(res.files[1].xml), res.files[1].name), 500);
}

/* ===== save straight into the clinic folder (Chrome/Edge on a computer): <clinic folder>/<MM-YYYY>/ ===== */
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open('echo_fs', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { const db = await idbOpen(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
let rootDir = null;
const dirMsg = document.getElementById('dirMsg');
function dirUi() {
  if (!window.showDirectoryPicker) return;
  document.getElementById('dirBox').style.display = 'block';
  dirMsg.textContent = rootDir ? 'الملفات بتنزل في: ' + rootDir.name + ' / (فولدر الشهر)' : 'لسه ما اخترتش فولدر. الملفات بتنزل في Downloads.';
  document.getElementById('pickDir').textContent = rootDir ? 'غيّر فولدر العيادة' : 'اختار فولدر العيادة';
}
async function dirReady(ask) {
  if (!rootDir) return false;
  try {
    let p = await rootDir.queryPermission({ mode: 'readwrite' });
    if (p !== 'granted' && ask) p = await rootDir.requestPermission({ mode: 'readwrite' });
    return p === 'granted';
  } catch (e) { return false; }
}
async function nameFree(dir, n) { try { await dir.getFileHandle(n); return false; } catch (e) { return true; } }
async function saveToFolder(res, month) {
  if (!(await dirReady(true))) return '';
  const sub = await rootDir.getDirectoryHandle(month, { create: true });
  let base = res.base;
  for (let i = 2; !(await nameFree(sub, base + '.docx') && await nameFree(sub, base + ' - report.docx')) && i < 100; i++) base = res.base + ' (' + i + ')';
  const names = [base + '.docx', base + ' - report.docx'];
  for (let i = 0; i < 2; i++) {
    const blob = makeZip([
      { name: '[Content_Types].xml', text: res.CONTENT_TYPES }, { name: '_rels/.rels', text: res.RELS }, { name: 'word/document.xml', text: res.files[i].xml },
    ]);
    const w = await (await sub.getFileHandle(names[i], { create: true })).createWritable();
    await w.write(blob); await w.close();
  }
  return rootDir.name + '/' + month + '/' + names[0];
}
async function deliverDocs(res, month) {
  try { const where = await saveToFolder(res, month); if (where) return { folder: where }; } catch (e) { /* fall back to a normal download */ }
  downloadDocs(res); return { download: true };
}
document.getElementById('pickDir').addEventListener('click', async () => {
  try { const h = await window.showDirectoryPicker({ mode: 'readwrite' }); rootDir = h; await idbSet('dir', h); dirUi(); } catch (e) { /* cancelled */ }
});
(async () => { try { rootDir = (await idbGet('dir')) || null; } catch (e) { rootDir = null; } dirUi(); })();

let showAll = false;
function renderLog() {
  const cases = loadCases();
  const pending = cases.filter((c) => !c.synced).length;
  document.getElementById('count').textContent = '(' + cases.length + ')';
  document.getElementById('syncBtn').textContent = pending ? 'ابعت للسيرفر (' + pending + ' مستنية)' : 'كله اتبعت ✓';
  listEl.textContent = '';
  const shown = showAll ? cases.length : 5;
  cases.slice().reverse().slice(0, shown).forEach((c) => {
    const row = document.createElement('div'); row.className = 'case';
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = c.patient_name + (c.nursery ? ' (' + c.nursery + ')' : '') + ' · ' + c.case_date;
    const st = document.createElement('span'); st.className = 'st'; st.textContent = c.synced ? 'اتبعتت' : 'على الجهاز بس';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'secondary'; b.style.marginTop = '0'; b.textContent = 'الملفات';
    b.addEventListener('click', async () => { try { const r = await deliverDocs(buildDocs(c.findings), c.month); syncMsg.textContent = r.folder ? 'اتحفظ في: ' + r.folder : 'اتحمّل الملفين.'; } catch (e) { syncMsg.textContent = 'خطأ: ' + e.message; } });
    row.append(nm, st, b); listEl.appendChild(row);
  });
  if (cases.length > 5) {
    const more = document.createElement('button'); more.type = 'button'; more.className = 'secondary';
    more.textContent = showAll ? 'اعرض آخر ٥ بس' : 'اعرض الكل (' + cases.length + ')';
    more.addEventListener('click', () => { showAll = !showAll; renderLog(); });
    listEl.appendChild(more);
  }
}

let syncing = false;
async function syncAll(manual) {
  if (syncing) return;
  const cases = loadCases(), todo = cases.filter((c) => !c.synced);
  if (!todo.length) { syncMsg.textContent = ''; return; }
  const code = getCode();
  if (!code) { syncMsg.textContent = 'اكتب كود الدخول في الخانة اللي فوق واضغط "حفظ الكود" عشان الحالات تتبعت. الحالات محفوظة على الجهاز.'; return; }
  syncing = true; let ok = 0, fail = 0, badCode = false;
  for (const c of todo) {
    const { synced, ...rec } = c;
    try {
      const r = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: code, case: rec }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) { c.synced = true; ok++; } else if (r.status === 401) { badCode = true; setCode(''); break; } else fail++;
    } catch (e) { fail++; break; }
  }
  saveCases(cases); syncing = false; renderLog();
  if (badCode) { syncMsg.textContent = 'الكود غلط. اكتبه تاني واضغط حفظ. الحالات لسه محفوظة على الجهاز.'; return; }
  syncMsg.textContent = fail ? 'اتبعت ' + ok + '، والباقي مستني (مفيش اتصال أو فيه مشكلة). الحالات محفوظة على الجهاز.' : 'اتبعت ' + ok + ' حالة للسيرفر ✓';
}
document.getElementById('syncBtn').addEventListener('click', () => syncAll(true));
const codeIn = document.getElementById('codeIn');
if (getCode()) codeIn.placeholder = '•••••• (محفوظ)';
document.getElementById('codeSave').addEventListener('click', () => {
  const v = codeIn.value.trim(); if (!v) { syncMsg.textContent = 'اكتب الكود الأول.'; return; }
  setCode(v); codeIn.value = ''; codeIn.placeholder = '•••••• (محفوظ)'; syncMsg.textContent = 'الكود اتحفظ.'; syncAll();
});
window.addEventListener('online', () => syncAll(false));
document.getElementById('backupBtn').addEventListener('click', () => {
  const d = new Date().toISOString().slice(0, 10);
  download(new Blob([JSON.stringify(loadCases(), null, 1)], { type: 'application/json' }), 'echo-cases-backup-' + d + '.json');
});

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const data = {};
  new FormData(form).forEach((v, k) => { data[k] = String(v); });
  if (!data['Patient name'].trim() || !data['Age'].trim()) { msg.textContent = 'اكتب الاسم والسن.'; return; }
  let res;
  try { res = buildDocs(data); } catch (e) { msg.textContent = 'حصل خطأ: ' + e.message; return; }
  const now = new Date(), p2 = (n) => String(n).padStart(2, '0');
  const cases = loadCases();
  cases.push({
    case_id: newId(),
    case_date: now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()),
    month: p2(now.getMonth() + 1) + '-' + now.getFullYear(),
    patient_name: data['Patient name'].trim(), age: data['Age'].trim(), weight: (data['Weight'] || '').trim(),
    nursery: (data['Nursery name'] || '').trim(), origin: (data['Origin'] || '').trim(), complaint: (data['Complaint'] || '').trim(),
    findings: data, synced: false,
  });
  const saved = saveCases(cases);
  const out = await deliverDocs(res, p2(now.getMonth() + 1) + '-' + now.getFullYear());
  msg.textContent = (out.folder ? 'اتحفظ ملفين في: ' + out.folder + ' (+ ملف التقرير جنبه)' : 'اتحمّل ملفين: ' + res.files[0].name + ' و ' + res.files[1].name) + (saved ? ' واتحفظت الحالة على الجهاز' : ' (تنبيه: مقدرتش أحفظ الحالة على الجهاز)') + (res.needs ? ' (فيه جمل ناقصة معلّمة بالأصفر)' : '');
  showPreview(res); renderLog(); syncAll(false);
});

document.getElementById('newCase').addEventListener('click', () => {
  form.reset(); syncNumbers(); preview.style.display = 'none'; msg.textContent = '';
  form.querySelector('input').focus();
});
syncNumbers(); renderLog();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
